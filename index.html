<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Mobile web app metadata — helps Android treat this as a game app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shadow Strike" />
    <meta name="theme-color" content="#05070b" />
    <meta name="application-name" content="Shadow Strike" />
    <!-- Disable tap highlight, callouts, text selection — this is a game -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070b'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23e8b545' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e8b545'/%3E%3Cpath d='M16 2v8M16 22v8M2 16h8M22 16h8' stroke='%23e8b545' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>SHADOW STRIKE — Tactical FPS</title>
    <style>
      /* Critical pre-React styles so the very first paint is correct
         on Android — avoids the 1-frame flash of unsized text that
         makes the menu look broken on first launch. */
      html, body { margin: 0; padding: 0; height: 100%; background: #05070b; overflow: hidden; }
      #root { height: 100%; }
      /* On Android WebView, the default text-size-adjust can blow up
         font sizes on rotation. Lock it. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
